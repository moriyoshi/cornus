name: Release

# On a v* tag this workflow produces a full release:
#   * multi-arch cornus image to GHCR
#       ghcr.io/<owner>/cornus:<semver>  (plus :latest and :<major>.<minor>)
#   * the Helm chart as an OCI artifact to GHCR (cosign-signed, keyless):
#       oci://ghcr.io/<owner>/charts/cornus:<semver>
#   * a GitHub Release carrying the prebuilt CLI binaries the README's quick
#     start downloads:
#       cornus-linux-amd64, cornus-linux-arm64
#     plus darwin amd64/arm64 and windows amd64, a SHA256SUMS manifest, and its
#     keyless cosign signature (SHA256SUMS.sig + SHA256SUMS.pem). The pushed
#     image manifest is also cosign-signed (keyless, GitHub OIDC).
#
#     Every binary is the ALL-IN-ONE build — embedded OTel Collector plus the
#     built-in observability store — so a downloaded cornus records workload
#     telemetry with no flags and no rebuild. The linux binaries remain fully
#     static (musl) despite being cgo builds; see the binaries job.
# workflow_dispatch builds the image AND every release binary, but publishes
# nothing: no chart push, no GitHub Release. That is the dry run to use before
# cutting a tag, and it exists because the binaries are now native cgo builds
# whose per-platform toolchains (mingw on windows, the framework set on darwin)
# can only really be proven by running them. Finding that out from a dispatch is
# cheap; finding it out from a v* tag means a botched release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  # One release run per ref. Do NOT cancel a run mid-publish — a half-pushed GHCR
  # image or partial GitHub Release is worse than waiting — so queue rather than
  # supersede. Tags are unique, so this only ever engages on a manual re-dispatch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Standard gate
    # A v* tag used to publish signed binaries, an image and a chart without a
    # single test having run on the tagged commit: ci.yml only fires on `push` to
    # main and on `pull_request`, neither of which matches a tag push, and there
    # is no cross-workflow dependency between the two files. A tag pointing at an
    # unmerged/amended commit therefore shipped untested. This job closes that:
    # every artifact-producing job below needs it, so nothing is built — let alone
    # signed or published — until the tagged tree passes the project's Go gate.
    #
    # Deliberately the CORE gate only (gofmt / build / vet / test), mirroring the
    # first four checks of ci.yml's `gate` job with the same runner, the same
    # pinned actions and the same setup-go configuration (go-version-file: go.mod
    # + cache: true) so the two stay consistent. The heavier optional-tag legs
    # ci.yml also runs (cloudblob, otelcol, imbh, the yamux/netem/sqlite nested
    # modules, e2e-check) are NOT duplicated here: they already gate every commit
    # that reaches main, and re-running them would add tens of minutes to the
    # critical path of every tag. Keep this job fast — it is what stands between a
    # tag and a release.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  image:
    name: Build and push image
    # NOTE: both platforms are built on this one amd64 runner via QEMU, and the
    # Dockerfile's build stage is deliberately NOT $BUILDPLATFORM-pinned (that is
    # what gives each arch a native gcc and the correct libc cell for the cgo
    # `imbh` build). The arm64 leg therefore links a ~600 MB Rust archive under
    # emulation, which was merely slow when this was CGO_ENABLED=0. If it becomes
    # too slow, split into native per-arch legs joined with `buildx imagetools
    # create` — see .agents/docs/TODO.md.
    #
    # Nothing gets built or pushed until the tagged commit passes the gate.
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing of the pushed image (GitHub OIDC).
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/cornus
          # latest=auto adds :latest on semver tags only.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamp main.version so `cornus version` in the image reports the
          # release version, matching the standalone binaries below.
          # steps.meta.outputs.version is the stripped semver on tag pushes
          # (same value as ${GITHUB_REF_NAME#v} used by the binaries job).
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        # Signs the multi-arch manifest list by digest, which covers every tag
        # pointing at it. Keyless: the signing certificate is bound to this
        # workflow's GitHub OIDC identity and recorded in the Rekor log.
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cornus"
          cosign sign --yes "${image}@${DIGEST}"

  chart:
    name: Publish Helm chart
    # Only version tags publish a chart (same gate as the binaries job):
    # workflow_dispatch rebuilds the image but must not overwrite a chart.
    if: startsWith(github.ref, 'refs/tags/v')
    # Nothing gets packaged, pushed or signed until the tagged commit passes the
    # gate. If `gate` fails, this job is skipped rather than run.
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing of the pushed chart (GitHub OIDC).
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR (helm)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Log in to GHCR (docker)
        # helm registry login writes helm's own registry config, which cosign
        # does not read: cosign authenticates from the docker config
        # (~/.docker/config.json). Without this the `cosign sign` below fails
        # uploading the signature layer to GHCR with UNAUTHORIZED. Same login
        # the image job uses so cosign can push the chart signature.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push chart
        # Both the chart version and appVersion are overridden to the release
        # tag's semver — the same value the image job tags the pushed image
        # with (steps.meta version) and the binaries job stamps into the CLI —
        # so `helm install oci://.../charts/cornus --version <semver>` deploys
        # ghcr.io/<owner>/cornus:<semver> without a per-release Chart.yaml
        # commit. The checked-in Chart.yaml version only tracks chart-only
        # changes between releases.
        run: |
          version="${GITHUB_REF_NAME#v}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          helm package deploy/helm/cornus \
            --version "${version}" \
            --app-version "${version}" \
            --destination dist
          # helm push prints "Digest: sha256:..." on success; capture it so
          # cosign signs exactly the artifact that was pushed.
          helm push "dist/cornus-${version}.tgz" "oci://ghcr.io/${owner}/charts" \
            |& tee push.log
          digest="$(sed -n 's/^Digest: //p' push.log)"
          if [ -z "${digest}" ]; then
            echo "::error::helm push did not report a digest" >&2
            exit 1
          fi
          cosign sign --yes "ghcr.io/${owner}/charts/cornus@${digest}"

  webui:
    name: Build web UI assets
    # The released CLI binaries embed the web UI (pkg/webui //go:embed dist). The
    # image job builds it inside the Dockerfile; the standalone binaries below
    # build outside it, so build the assets ONCE here (arch-independent) and share
    # them with every binaries matrix job via an artifact. Same gate as the
    # binaries job it feeds, dispatch included.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # Gate first: `binaries` needs this job, so gating here also gates every
    # binary leg transitively (they are additionally listed on `binaries` itself
    # so the dependency is legible without following the chain).
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Upload web UI assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webui-dist
          path: pkg/webui/dist
          if-no-files-found: error

  binaries:
    name: Build CLI binary (${{ matrix.goos }}/${{ matrix.goarch }})
    # Version tags produce downloadable release binaries; workflow_dispatch builds
    # the same five artifacts as a DRY RUN (the `release` job below stays tag-only,
    # so nothing is published). Use a dispatch to prove the native cgo toolchains
    # before tagging.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # Wait for the standard gate (no binary is built from an untested commit) and
    # for the shared web UI build so `go build` embeds the real SPA.
    needs: [gate, webui]
    runs-on: ${{ matrix.runner }}
    strategy:
      # Every published binary is the ALL-IN-ONE build: the embedded OTel
      # Collector (`otelcol`) plus the built-in observability store (`imbh`), so a
      # downloaded cornus records workload telemetry out of the box. The recipe
      # itself lives in .github/scripts/build-release-binary.sh — shared with
      # local reproduction, and the single place the tag list is defined.
      #
      # That makes every leg a NATIVE cgo build rather than the cross-compile this
      # job used to be: `imbh` is a Rust static library reached over cgo, so each
      # target needs its own C toolchain and a libc-matched libimbhgo.a. Building
      # on the target platform also means the artifact is RUNNABLE here, which is
      # what lets the script assert the store actually linked in instead of
      # trusting the tag list.
      #
      # The build engine (pkg/build/builder) is linux-only behind //go:build
      # linux; cmd/cornus stubs it out elsewhere, so darwin/windows compile the
      # CLI without it. Windows artifacts carry a .exe suffix (ext).
      #
      # No windows/arm64: upstream imbh-go publishes no libimbhgo.a for that cell
      # (linux amd64/arm64 x glibc/musl, darwin amd64/arm64 and windows amd64
      # only), and shipping the one binary WITHOUT the store would defeat the
      # point of "always all-in-one". Restore the leg when the archive exists.
      #
      # fail-fast stays off: one platform's toolchain breaking should still let
      # the others build, so a release is never blocked on re-running all five.
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: "", runner: ubuntu-24.04 }
          - { goos: linux, goarch: arm64, ext: "", runner: ubuntu-24.04-arm }
          - { goos: darwin, goarch: amd64, ext: "", runner: macos-15-intel }
          - { goos: darwin, goarch: arm64, ext: "", runner: macos-15 }
          - { goos: windows, goarch: amd64, ext: ".exe", runner: windows-2025 }
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go (macOS / Windows)
        # The linux legs build inside golang:1.26-alpine and use THAT image's
        # toolchain (it has to be a musl environment — see the build step), so
        # they need no host Go at all.
        #
        # cache:false — setup-go's built-in cache keys the module AND build cache
        # under one go.sum-derived key with no GOOS/GOARCH component, so the
        # matrix legs would race on a single key and restore a build cache
        # compiled for the wrong target. The two directories are cached
        # explicitly below instead.
        if: matrix.goos != 'linux'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve Go cache paths (macOS / Windows)
        # GOMODCACHE/GOCACHE are NOT ~/go/pkg/mod and ~/.cache/go-build outside
        # linux (macOS uses ~/Library/Caches/go-build, Windows
        # ~/AppData/Local/go-build), so ask the toolchain rather than hardcoding a
        # path that would silently cache nothing.
        if: matrix.goos != 'linux'
        id: gocache
        shell: bash
        run: |
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      - name: Cache Go caches (macOS / Windows)
        # Module downloads are source and identical across targets, but the
        # compiler build cache is target-specific, so the key carries GOOS/GOARCH.
        # github.sha makes each run save a fresh entry while restore-keys fall
        # back to the most recent cache for this target, so only changed packages
        # recompile.
        if: matrix.goos != 'linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.mod }}
            ${{ steps.gocache.outputs.build }}
          key: gorel-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gorel-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('go.sum') }}-
            gorel-${{ matrix.goos }}-${{ matrix.goarch }}-

      - name: Cache Go caches (linux, container-mounted)
        # These directories are bind-mounted into the Alpine build container at
        # its own GOMODCACHE/GOCACHE, so they must live outside the workspace
        # (which gets uploaded) and are cached here rather than by path guesswork.
        if: matrix.goos == 'linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/gomod
            ${{ runner.temp }}/gobuild
          key: gorel-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gorel-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('go.sum') }}-
            gorel-${{ matrix.goos }}-${{ matrix.goarch }}-

      - name: Download web UI assets
        # Restores pkg/webui/dist (built once by the webui job) so the
        # //go:embed in pkg/webui embeds the real SPA into this binary. Without
        # it, `go build` would embed the "run make web" placeholder.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: webui-dist
          path: pkg/webui/dist

      - name: Verify a C toolchain is present (Windows)
        # `imbh` makes this a cgo build, so a missing gcc has to fail with a
        # legible message here rather than as an opaque link error 200 MB later.
        # The windows runner images ship mingw-w64 on PATH; assert it.
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          gcc --version || {
            echo "::error::no gcc on PATH; the windows leg needs mingw-w64 for the cgo (imbh) build" >&2
            exit 1
          }

      - name: Build binary (linux, static musl in Alpine)
        # Linux binaries stay FULLY STATIC despite now being cgo builds, so the
        # download still runs on any distro (Alpine, distroless, old glibc) as the
        # previous CGO_ENABLED=0 artifacts did. That needs a musl environment,
        # hence the Alpine container — invoked with `docker run` rather than the
        # job-level `container:` key on purpose: the JS-based actions above need
        # the runner's glibc node, which does not execute inside Alpine.
        #
        # The container is native to this runner (ubuntu-24.04 / -arm), so no QEMU
        # and the artifact is runnable for the script's self-assertions.
        if: matrix.goos == 'linux'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p "${RUNNER_TEMP}/gomod" "${RUNNER_TEMP}/gobuild"
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" -w /src \
            -v "${RUNNER_TEMP}/gomod:/go/pkg/mod" \
            -v "${RUNNER_TEMP}/gobuild:/root/.cache/go-build" \
            -e GOOS -e GOARCH \
            -e VERSION="${GITHUB_REF_NAME#v}" \
            -e OUT="cornus-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" \
            golang:1.26-alpine \
            sh -c 'apk add --no-cache bash build-base file >/dev/null && bash .github/scripts/build-release-binary.sh'

      - name: Build binary (macOS / Windows, native cgo)
        if: matrix.goos != 'linux'
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}" \
          OUT="cornus-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" \
            bash .github/scripts/build-release-binary.sh

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cornus-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          path: cornus-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    # FAIL CLOSED across all three artifact families. This used to be
    # `needs: binaries` alone, which meant a failed `image` or `chart` still
    # produced a published GitHub Release: the release notes would advertise a
    # version whose GHCR image or Helm chart never got pushed, and the divergence
    # was silent. A release is now all-or-nothing.
    #
    # The guard is plain `needs` + the existing tag-only `if`, deliberately NOT
    # `if: always() && !contains(needs.*.result, 'failure')`:
    #
    #   * Default `needs` semantics are already exactly what is wanted — this job
    #     runs only when EVERY listed job succeeded, and a failed OR cancelled
    #     dependency skips it. `!contains(..., 'failure')` would let a CANCELLED
    #     image/chart job through, which is strictly weaker.
    #   * `always()` would have to be re-qualified with the tag check anyway,
    #     because it overrides the skip-on-skipped-dependency rule.
    #   * The skipped-vs-failed worry does not arise on this graph. The only
    #     conditionally-skipped dependency is `chart` (tag-only), and it is
    #     skipped exactly when `github.ref` is not a v* tag — i.e. on a
    #     workflow_dispatch dry run, where this job's own `if` is already false
    #     and it must not run regardless. On a real v* tag `image`, `chart` and
    #     `binaries` all evaluate their conditions to true, so none of them is
    #     legitimately skipped and any skip is a genuine upstream failure that
    #     SHOULD block the release. Adding `always()` would therefore only create
    #     a way to publish past a broken artifact.
    #
    # `gate` is not listed: it is a transitive dependency of all three, and a
    # gate failure skips them, which skips this job.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, chart, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Keyless cosign signing of the SHA256SUMS manifest (GitHub OIDC).
      id-token: write
    steps:
      - name: Check out code
        # This job had no checkout: it only ever consumed uploaded artifacts. It
        # is needed now so THIRD_PARTY_NOTICES.md (a tracked repo-root file, not a
        # build output) can be attached to the release. It MUST stay the FIRST
        # step — actions/checkout cleans the workspace, so running it after the
        # download would delete dist/.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download built binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        # One manifest covering every released binary. Filenames are recorded
        # relative to dist/ so `sha256sum -c SHA256SUMS` works next to the
        # downloaded binaries.
        run: |
          cd dist
          sha256sum cornus-* > SHA256SUMS
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign SHA256SUMS (keyless)
        # Keyless signature over the checksum manifest as a single Sigstore
        # bundle (SHA256SUMS.bundle) carrying the signature, the short-lived
        # Fulcio certificate, and the Rekor inclusion proof. cosign v3 defaults
        # sign-blob to this new bundle format and ignores the old
        # --output-signature/--output-certificate flags, so we emit the bundle
        # directly. Verify with
        #   cosign verify-blob --bundle SHA256SUMS.bundle \
        #     --certificate-identity-regexp 'github.com/.+/.github/workflows/release.yml' \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
        #     SHA256SUMS
        run: |
          cosign sign-blob --yes \
            --bundle dist/SHA256SUMS.bundle \
            dist/SHA256SUMS

      - name: Create release and attach binaries
        # Attaches every built artifact: cornus-{linux,darwin}-{amd64,arm64} and
        # cornus-windows-amd64.exe, plus the SHA256SUMS manifest and its keyless
        # cosign bundle. (No windows/arm64 — upstream imbh-go publishes no
        # libimbhgo.a for that cell; see the binaries job matrix.) The README's
        # quick start fetches
        #   releases/latest/download/cornus-linux-<arch>
        # so those Linux filenames must stay exactly cornus-linux-amd64/arm64.
        #
        # THIRD_PARTY_NOTICES.md rides along from the checkout above: every
        # released binary statically links its whole dependency tree, and several
        # of those licenses require the notice text to accompany the distributed
        # binary. Shipping it only in the git tree does not satisfy that for
        # someone who downloads a single `cornus-linux-amd64`. It is attached from
        # the repo root, OUTSIDE dist/, so the `sha256sum cornus-*` glob and the
        # cosign-signed SHA256SUMS manifest are byte-for-byte unchanged.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/cornus-*
            dist/SHA256SUMS
            dist/SHA256SUMS.bundle
            THIRD_PARTY_NOTICES.md
          fail_on_unmatched_files: true
          generate_release_notes: true
