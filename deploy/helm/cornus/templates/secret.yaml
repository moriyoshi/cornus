{{- $name := printf "%s-installation" (include "cornus.fullname" .) -}}
{{- /*
  Alphanumeric, NOT randBytes: this value reaches the server through a
  secretKeyRef env var, and a process environment cannot carry a NUL. randBytes
  yields base64 of 32 arbitrary BYTES, so Kubernetes decodes it back to raw
  binary and roughly 12% of fresh installs (1 - (255/256)^32) would embed a NUL
  and fail nondeterministically. randAlphaNum is env-safe by construction; b64enc
  matches the encoding `lookup` returns for an existing Secret below, so both
  branches assign the same shape.
*/ -}}
{{- $secret := randAlphaNum 32 | b64enc -}}
{{- with (lookup "v1" "Secret" .Release.Namespace $name) -}}
  {{- with (index .data "installation-secret") -}}
    {{- $secret = . -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "cornus.labels" . | nindent 4 }}
type: Opaque
data:
  installation-secret: {{ $secret | quote }}
