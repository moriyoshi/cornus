# Public-image fixture for mcp-stdio-tools.star. Both services use the same
# image so targets pull only once; the deterministic startup markers make the
# bounded logs_tail assertion independent of timing.
name: mcpe2e
services:
  helper:
    image: busybox:1.36
    command: ["sh", "-c", "echo mcp-helper-ready; while true; do sleep 3600; done"]
  app:
    image: busybox:1.36
    depends_on:
      - helper
    command: ["sh", "-c", "echo mcp-app-ready; while true; do sleep 3600; done"]
