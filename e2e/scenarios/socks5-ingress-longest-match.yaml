# Two services sharing ONE emulated-ingress host (shared.example.com) but rooted at
# different paths: web-svc at /svc, web-root at /. This is the configuration that must
# resolve by LONGEST path match — like a real Kubernetes ingress — rather than the
# second-registered ingress shadowing the first.
#
# traefik/whoami answers 200 on every path and prints its own `Hostname:` (which
# compose `hostname:` sets on both docker and kube), so a response tells us which
# backend served the request. Public image, no build, so it runs on docker + kube.
#
# The longer path is `/svc`, NOT `/api`: whoami reserves `/api` as a built-in endpoint
# that returns a JSON dump instead of the plaintext `Hostname:` echo, so a request to
# exactly `/api` would route correctly yet answer in the wrong format. Keep this path
# clear of whoami's reserved words (/api, /data, /echo, /health, /bench).
name: e2e
services:
  web-root:
    image: traefik/whoami
    hostname: backend-root
    ports:
      - "8080:80"
    x-cornus-ingress:
      hosts:
        - shared.example.com
      path: /
  web-svc:
    image: traefik/whoami
    hostname: backend-svc
    ports:
      - "8081:80"
    x-cornus-ingress:
      hosts:
        - shared.example.com
      path: /svc
