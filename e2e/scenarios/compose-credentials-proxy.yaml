# Compose form of the auth-injecting credential proxy: the app holds NO key.
# `x-cornus-credentials:` mints the token on the CLIENT (static backend) and the
# caretaker's anthropic-proxy sidecar injects it per request, with `upstream:`
# pinned at a mock stand-in for api.anthropic.com.
#
# Both values are interpolated from the environment the harness sets on the held
# `compose up` process: the upstream is a pod IP only known at run time, and a
# token belongs in the environment rather than a committed file even in a test.
services:
  app:
    image: busybox:1.36
    command: ["sleep", "3600"]
    x-cornus-credentials:
      - name: claude
        backend: static
        config:
          oauth_token: ${AI_TOKEN}
        deliveries:
          - kind: endpoint
            provider: anthropic-proxy
            upstream: ${AI_UPSTREAM}
